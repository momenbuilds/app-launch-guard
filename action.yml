name: AppLaunchGuard
description: Scan iOS apps for App Store submission risks before review.
author: Momen Adel
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: Path to the iOS project.
    required: false
    default: "."
  output:
    description: Report output format. Use terminal, markdown, json, or html.
    required: false
    default: "markdown"
  fail-on:
    description: Fail on critical, warning, or none.
    required: false
    default: "critical"
  no-color:
    description: Disable colored terminal output.
    required: false
    default: "true"
  include-docs:
    description: Scan additional documentation files outside README, docs/, and fastlane metadata.
    required: false
    default: "false"
  include-all:
    description: Scan all text files except dependency, build output, and git folders.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Run AppLaunchGuard
      shell: bash
      run: |
        args=("scan" "${{ inputs.path }}" "--fail-on" "${{ inputs.fail-on }}")
        if [ "${{ inputs.output }}" = "markdown" ]; then
          args+=("--markdown" "--output" "app-launch-guard-report.md")
        elif [ "${{ inputs.output }}" = "json" ]; then
          args+=("--json" "--output" "app-launch-guard-report.json")
        elif [ "${{ inputs.output }}" = "html" ]; then
          args+=("--html" "--output" "app-launch-guard-report.html")
        fi
        if [ "${{ inputs.no-color }}" = "true" ]; then
          args+=("--no-color")
        fi
        if [ "${{ inputs.include-docs }}" = "true" ]; then
          args+=("--include-docs")
        fi
        if [ "${{ inputs.include-all }}" = "true" ]; then
          args+=("--include-all")
        fi
        node "$GITHUB_ACTION_PATH/dist/index.js" "${args[@]}"
        if [ -f app-launch-guard-report.md ]; then
          cat app-launch-guard-report.md
        fi
        if [ -f app-launch-guard-report.json ]; then
          cat app-launch-guard-report.json
        fi
        if [ -f app-launch-guard-report.html ]; then
          echo "HTML report written to app-launch-guard-report.html"
        fi
